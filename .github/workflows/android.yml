name: Build IDEN Translator APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install web dependencies
        working-directory: web
        run: npm install
      - name: Bundle ONNX Runtime WebAssembly files
        run: |
          mkdir -p web/public/wasm
          cp web/node_modules/onnxruntime-web/dist/*.wasm web/public/wasm/
          cp web/node_modules/onnxruntime-web/dist/*.mjs web/public/wasm/ || true
      - name: Download offline translation models
        run: |
          python -m pip install --upgrade huggingface_hub
          python web/scripts/download_models.py
      - name: Build web application
        working-directory: web
        run: npm run build
      - name: Copy web app into Android assets
        run: |
          mkdir -p app/src/main/assets/www
          cp -R web/dist/. app/src/main/assets/www/
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: |
          gradle wrapper --gradle-version 8.9
          ./gradlew --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IDEN-Translator-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
